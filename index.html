<script>
(function(){
  /* No email capture — this is a reference tool. Corrections and questions
     come in via the Contact link in the footer. */
  const S = TT_DATA.schools;
  const BY_SLUG = Object.fromEntries(S.map(s => [s.slug, s]));
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = r => r == null ? '—' : (r*100).toFixed(1) + '%';
  /* WO3 §6 — the typeset form of a rate: full-weight digits, demoted unit. Used only
     where the rate is a display object. Inside a sentence, pct() stays plain. */
  const pctSet = r => r == null ? '—' : `${(r*100).toFixed(1)}<span class="pct-u">%</span>`;
  const n = v => v == null ? '—' : v.toLocaleString('en-US');
  const yearNum = y => { const m = /20\d\d/.exec(y||''); return m ? +m[0] : 0; };

  /* ---------- cycle year ----------
     A rate without its cycle is an unlabeled number, so every rate we print carries
     the cycle it came from. The reference cycle is the newest one present in the
     data, computed at runtime — schools publish their Common Data Sets on their own
     schedules, so when the dataset rolls forward every label re-bases with it. */
  const REF_CYCLE_NUM = S.reduce((max, s) => Math.max(max, yearNum(s.year)), 0);
  const REF_CYCLE = (S.find(s => yearNum(s.year) === REF_CYCLE_NUM) || {}).year || '';

  // 'current' | 'behind1' | 'behind2' | 'unconfirmed'
  function cycleState(s){
    const y = yearNum(s.year);
    if(!y) return 'unconfirmed';
    const gap = REF_CYCLE_NUM - y;
    if(gap <= 0) return 'current';
    if(gap === 1) return 'behind1';
    return 'behind2';
  }
  // reader-facing label. Written the way a student reads it: "2023-24 data", not "STALE".
  function cycleLabel(s){
    return cycleState(s) === 'unconfirmed' ? 'Cycle year unconfirmed' : s.year + ' data';
  }
  // the inline year marker that rides alongside every displayed rate
  function cycleTag(s){
    const st = cycleState(s);
    const title = {
      current:    'From the most recent cycle in our data (' + REF_CYCLE + ')',
      behind1:    'One cycle behind the newest data we hold — this is the newest edition this school publishes',
      behind2:    'Two or more cycles behind the newest data we hold — this is the newest edition this school publishes',
      unconfirmed:'This record does not state which admissions cycle it covers'
    }[st];
    return `<span class="cyc cyc-${st}" title="${esc(title)}">${esc(cycleLabel(s))}</span>`;
  }
  // one plain sentence explaining what this record's cycle means, for detail views
  function cycleSentence(s){
    return {
      current:    'These figures cover the ' + s.year + ' admissions cycle — the most recent cycle in our data.',
      behind1:    'These figures cover the ' + s.year + ' cycle, one behind the newest data we hold. It is the most recent edition this school has published.',
      behind2:    'These figures cover the ' + s.year + ' cycle, two or more behind the newest data we hold. It is still the most recent edition this school has published.',
      unconfirmed:'This record does not state which admissions cycle it covers, so we do not claim one.'
    }[cycleState(s)];
  }
  const isStale = s => s.applicants != null && (cycleState(s) === 'behind2');
  const isGap = s => s.flags.includes('not_published_official');
  const asPublished = s => s.flags.some(f => f.includes('implausible'));
  const fromArchive = s => s.flags.some(f => f.includes('refresh_from_live'));

  // school/state matcher — supports school name substring, 2-letter code ("ca"),
  // full state name ("california"), and partials len>=3 ("calif", "new ham")
  const STATE_ABBR = {alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY'};
  function matchQuery(s, q){
    q = q.toLowerCase().trim(); if(!q) return true;
    if(s.name.toLowerCase().includes(q)) return true;
    const st = s.state.toLowerCase();
    if(st === q) return true;                                   // "ca"
    if(STATE_ABBR[q] && STATE_ABBR[q].toLowerCase() === st) return true;   // "california"
    if(q.length >= 3){ for(const name in STATE_ABBR){          // "calif", "new ham"
      if(name.startsWith(q) && STATE_ABBR[name].toLowerCase() === st) return true; } }
    return false;
  }

  /* Application platform (Common App / own portal / Coalition / UC / CSU / ApplyTexas)
     is deliberately NOT surfaced. Schools state it on their own transfer pages and we
     link straight there, so carrying our own copy is one more thing to keep true.
     `reqs.applyVia` stays in the data untouched — it is still used upstream. */

  // flag -> reader-facing honesty note (curated; unknown flags render nothing)
  const FLAG_NOTES = {
    only_min_published:'',
    dates_may_roll:'These dates are from the most recently posted cycle. Confirm the current cycle with the school.',
    residency_rule_only:'The school states a residency rule (credits you must complete on campus) rather than a numeric cap on transfer credits.',
    no_numeric_cap_published:'No numeric transfer-credit cap is published.',
    cds_d7_conflict:'The school’s transfer page and its Common Data Set list different deadlines — we show the school-page value.',
    js_blocked:'Some official pages require a browser to render; values were verified from the sources we could reach.',
    js_blocked_deadline_table:'The deadline table is script-rendered; deadlines were verified from the reachable text.',
    waf_blocked:'The school’s server blocks automated access; values were verified from alternate official sources.',
    stale_page_banner:'The page carried an out-of-date banner; dates were checked against the current cycle where possible.',
    content_from_gatsby_page_data:'Captured from the page’s underlying data feed — verify visually.',
    spring_suspended_2026_recheck_2027:'Spring transfer admission was suspended for 2026; recheck for 2027.',
    spring_us_citizens_and_prs_only:'Spring entry is limited to U.S. citizens and permanent residents.',
    spring_sophomores_only:'Spring entry is limited to sophomore-level transfers.',
    spring_restricted:'Spring transfer entry is restricted — see the school’s page for who qualifies.',
    spring_deadline_not_published:'A spring cycle exists but no spring deadline is published.',
    per_school_variation:'Deadlines or requirements vary by college/major within the school.',
    program_deadlines_vary:'Deadlines vary by program.',
    cap_two_year_only:'The credit cap shown applies to two-year/community-college transfer credit.',
    cap_in_courses:'The cap is stated in courses rather than credit hours.',
    cap_stated_in_years:'The limit is expressed as a year-standing rule rather than a credit number.',
    priority_then_rolling:'These are priority dates, not hard closing dates — the school keeps reviewing applications on a rolling basis afterward.',
    university_wide_policy:'Deadlines and credit-transfer limits are set university-wide across campuses; we confirmed them against this campus\u2019s own dates page.',
    gpa_stats_2023_24_cycle:'',
    gpa_stats_fall_2023_cycle:'',
  };
  const flagNotes = flags => (flags||[]).map(f => FLAG_NOTES[f]).filter(Boolean);

  /* ===================== SIGNATURE ELEMENT: the provenance seal =====================
     The differentiator is that every number links to the school's own filing, so this
     is the one element that raises its voice. Compressed in list rows; expanded on a
     school page into a receipt whose connectors trace claim -> document. */
  const verifiedOn = s => (s.reqs && s.reqs.reqVerified) || s.lastVerified || TT_DATA.generated;

  function seal(s){
    const what = isGap(s) ? 'Checked against this school’s official pages'
                          : 'Extracted from this school’s own official filing';
    return `<a class="seal" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener"
      onclick="event.stopPropagation()" title="${esc(what)} · last verified ${esc(verifiedOn(s))}"
      aria-label="${esc(what)}, last verified ${esc(verifiedOn(s))}. Opens the source in a new tab.">
      <span class="seal-ring" aria-hidden="true">✓</span>
      <span class="seal-body"><b>source</b><span class="seal-date">${esc(s.lastVerified||TT_DATA.generated)}</span></span></a>`;
  }

  // the expanded receipt: which claims each document backs, not a flat list of links
  function receipt(s){
    const r = s.reqs;
    const claims = [];
    if(s.sourceUrl){
      claims.push([ isGap(s) ? 'Transfer admission counts — confirmed not published'
                             : 'Transfer admit rate, applicants, admitted, enrolled',
                    [['Common Data Set' + (s.year ? ' ' + s.year : ''), s.sourceUrl]] ]);
    }
    if(r && (r.reqSources||[]).length){
      const src = r.reqSources.slice();
      const head = src.slice(0,2).map((u,i) => [i===0?'Transfer admissions page':'Supporting page', u]);
      claims.push(['Deadlines, credit cap, and GPA requirements', head, src.slice(2)]);
    }
    const body = claims.map(([what, links, more]) => `
      <div class="claim">
        <div class="claim-what">${esc(what)}</div>
        ${links.map(([label,u]) => `<div class="claim-src"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(label)} ↗</a></div>`).join('')}
        ${(more&&more.length)?`<div class="claim-more">${more.length} further source${more.length>1?'s':''} checked: ${more.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}↗</a>`).join(' ')}</div>`:''}
      </div>`).join('');
    return `<div class="receipt">
      <div class="receipt-head">
        <span class="seal-ring" aria-hidden="true">✓</span>
        <span class="receipt-stamp">Verified</span>
        <span class="receipt-date">${esc(verifiedOn(s))}</span>
      </div>
      ${body || '<div class="claim"><div class="claim-what">No source on file.</div></div>'}
    </div>`;
  }

  /* zero-result and not-found states name the next action rather than reporting absence */
  function emptyRow(cols, query, clearId){
    return `<tr><td colspan="${cols}"><div class="empty">
      <h3>No school matches “${esc(query)}”.</h3>
      <p>Try a state instead — “Texas” or “TX” both work — or clear the filters to see all ${S.length}.</p>
      <button class="btn" type="button" id="${clearId}">Clear search</button>
    </div></td></tr>`;
  }

  const isoKey = s => (s.reqs && s.reqs.fallDeadlineIso) ? s.reqs.fallDeadlineIso : 'zz';
  const admitsSpring = s => {
    const r = s.reqs; if(!r) return false;
    const sd = (r.springDeadline||'').toLowerCase();
    if(sd === 'none' || r.springType === 'none') return false;
    return !!(r.springDeadline || ['priority','final','rolling'].includes(r.springType));
  };
  const typeLabel = t => (t && t!=='none') ? `<span class="dtype">${esc(t)}</span>` : '';
  const springCell = r => {
    const sd = (r.springDeadline||'').trim();
    if(!sd) return '<span class="dim">—</span>';
    if(sd.toLowerCase()==='none' || r.springType==='none') return '<span class="nospring">no spring intake</span>';
    return `${esc(sd)}${typeLabel(r.springType)}`;
  };

  /* ---------- shared chrome ---------- */
  function heroStats(){
    const withStats = S.filter(s => s.applicants != null);
    const hardest = withStats.reduce((a,b) => (b.rate!=null && b.rate < a.rate) ? b : a, {rate:9});
    return [
      ['150+','schools covered'],
      ['100%','source-linked'],
      ['150+','with deadlines & caps'],
      [pctSet(hardest.rate), 'lowest: ' + hardest.name.replace(' University','')]
    ].map(([b,l]) => `<div class="stat"><b class="num">${b}</b><span>${esc(l)}</span></div>`).join('');
  }
  /* Asymmetric hero. The right column is not decoration: it shows a real record
     with its real source link, so the differentiator is demonstrated rather than
     described. Every child carries a --i index for the single page-load reveal. */
  /* ===== WO2 Task 2 — hero-card aggregates, all derived from TT_DATA at runtime.
     Nothing here is hardcoded; if the dataset changes these figures move with it. ===== */

  // Most common fall deadlines. Records whose date can't be read are excluded from the
  // aggregate and counted, never guessed at.
  function fallDeadlinePattern(){
    const counts = {}; let used = 0, unreadable = 0, nonePublished = 0;
    for(const s of S){
      const d = resolveDeadline(s, 'fall');
      if(d.kind === 'date'){ used++; const k = d.label.replace(/,.*$/, '');   // month+day, never a year we invented
        counts[k] = (counts[k]||0) + 1; }
      else if(d.kind === 'unparsed') unreadable++;
      else nonePublished++;
    }
    const top = Object.entries(counts)
      .sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,4);
    return { top, used, unreadable, nonePublished, total:S.length, max: top.length ? top[0][1] : 0 };
  }

  // Typical application-opening timing. Reported as the modal month with its count —
  // and with how many of those values are our own estimate rather than a published date.
  function appOpenPattern(){
    const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const months = {}; let rolling = 0, unstated = 0, estimated = 0, notADate = 0;
    for(const s of S){
      const raw = ((s.reqs && s.reqs.appOpens) || '').trim();
      if(!raw){ unstated++; continue; }
      if(/est\./i.test(raw)) estimated++;
      if(/rolling|year-round/i.test(raw)){ rolling++; continue; }
      const low = raw.toLowerCase();
      let i = MON.findIndex(m => low.includes(m.toLowerCase()) || low.includes(m.slice(0,3).toLowerCase()));
      if(i < 0){ const m = /^(\d{1,2})\//.exec(raw); if(m && +m[1] >= 1 && +m[1] <= 12) i = +m[1]-1; }
      if(i < 0){ notADate++; continue; }
      months[MON[i]] = (months[MON[i]]||0) + 1;
    }
    const ranked = Object.entries(months).sort((a,b) => b[1]-a[1]);
    return { month: ranked.length ? ranked[0][0] : null, count: ranked.length ? ranked[0][1] : 0,
             rolling, unstated, estimated, notADate, total:S.length };
  }

  // Coverage — the strongest trust argument is the coverage itself.
  function coverageStats(){
    const total = S.length;
    const sourced = S.filter(x => x.sourceUrl).length;
    const current = S.filter(x => yearNum(x.year) === REF_CYCLE_NUM).length;
    const dates = S.map(x => x.lastVerified).filter(Boolean).sort();
    return { total, sourced, current, refCycle: REF_CYCLE,
             sourcedPct: Math.round(sourced/total*100), currentPct: Math.round(current/total*100),
             from: dates[0] || TT_DATA.generated, to: dates[dates.length-1] || TT_DATA.generated };
  }

  /* ---- the selectivity distribution. 148 published rates, bucketed into the same
     bands the estimate model uses, so the chart and the model tell one story. ---- */
  function rateDistribution(){
    const withRate = S.filter(x => x.rate != null);
    const rows = EST.SEL.map(([lo,hi], i) => {
      const inBand = withRate.filter(x => x.rate >= lo && x.rate < hi);
      return { i:i+1, lo, hi, n:inBand.length,
               label: lo === 0 ? `under ${ratePct(hi)}` : hi > 1 ? `${ratePct(lo)}+` : `${ratePct(lo)}\u2013${ratePct(hi)}` };
    });
    const sorted = withRate.map(x => x.rate).sort((a,b) => a-b);
    const mid = sorted.length % 2 ? sorted[(sorted.length-1)/2]
                                  : (sorted[sorted.length/2-1] + sorted[sorted.length/2]) / 2;
    return { rows, max: Math.max(...rows.map(r => r.n)), counted: withRate.length,
             median: mid, hardest: sorted[0], easiest: sorted[sorted.length-1] };
  }

  function distChart(){
    const d = rateDistribution();
    const bars = d.rows.map(r => `
      <div class="dist-row">
        <span class="dist-l">${esc(r.label)}</span>
        <span class="dist-t"><span class="dist-b sel-${r.i}" style="width:${Math.round(r.n/d.max*100)}%"></span></span>
        <span class="dist-n num">${r.n}</span>
      </div>`).join('');
    return `<div class="distcard">
      <div class="dist-head">
        <div>
          <div class="eyebrow">Shape of the database</div>
          <h3 class="dist-title">Most transfer doors are wider than you think.</h3>
        </div>
        <div class="dist-key" aria-hidden="true">
          <span>harder</span>
          ${[1,2,3,4,5,6].map(i => `<i class="sel-${i}"></i>`).join('')}
          <span>easier</span>
        </div>
      </div>
      <div class="dist-bars">${bars}</div>
      <p class="dist-foot">Transfer admit rate across the <b>${d.counted}</b> schools that publish one. The middle school of the set sits at <b>${estPct(d.median)}</b> — the hardest at <b>${estPct(d.hardest)}</b>, the most open at <b>${estPct(d.easiest)}</b>. The same six bands drive the estimate model.</p>
    </div>`;
  }

  /* ---- the four hero cards. Same visual container; page-relevant content. ---- */
  function panelHowItWorks(){
    return `<aside class="dark heropanel rv" style="--i:3">
      <div class="heropanel-k">How to read this database</div>
      <ol class="hp-steps">
        <li><b>Every rate is the school's own figure.</b> Taken from Section D of its Common Data Set — transfer applicants, admitted, enrolled. Not a freshman rate, and never an estimate.</li>
        <li><b>The tag beside each rate is the cycle it covers.</b> <span class="cyc cyc-current">${esc(REF_CYCLE)} data</span> is the newest we hold. An amber tag means the school has not published since; we label it rather than hide it.</li>
        <li><b>The check mark opens the filing itself.</b> Every row links to the document its number came from, so you can check our work.</li>
      </ol>
    </aside>`;
  }

  function panelDeadlines(){
    const f = fallDeadlinePattern(), o = appOpenPattern();
    const bars = f.top.map(([label,count]) => `<li class="hp-bar">
        <span class="hp-bar-l">${esc(label)}</span>
        <span class="hp-bar-t"><span style="width:${Math.round(count/f.max*100)}%"></span></span>
        <span class="hp-bar-n">${count}</span></li>`).join('');
    return `<aside class="dark heropanel rv" style="--i:3">
      <div class="heropanel-k">Patterns across all ${f.total} schools</div>
      <div class="hp-title">The most common fall deadlines</div>
      <ul class="hp-bars">${bars}</ul>
      <div class="heropanel-meta">
        Drawn from <b>${f.used} of ${f.total}</b> records that publish a fall date we can read${f.nonePublished?`; ${f.nonePublished} publish none`:''}${f.unreadable?`; ${f.unreadable} could not be read and were left out rather than guessed`:''}.
        <br><br>${o.month ? `<b>${o.count}</b> schools open applications in <b>${esc(o.month)}</b>${o.rolling?`, and ${o.rolling} accept on a rolling basis` : ''}. ${o.estimated} of the opening dates are our own estimate rather than a date the school publishes — those are marked on the school's own row.` : ''}
        <br><br>These are patterns across the dataset, not any single school's dates. Always confirm on the school's page.
      </div>
    </aside>`;
  }

  function coveragePanel(){
    const c = coverageStats();
    const cells = [
      [c.total, 'schools covered'],
      [c.sourcedPct + '%', 'link to a source filing'],
      [c.currentPct + '%', 'on the ' + c.refCycle + ' cycle'],
      [c.total - c.current, 'labelled as an older cycle']
    ].map(([b,l]) => `<div class="cov-cell"><b class="num">${esc(String(b))}</b><span>${esc(l)}</span></div>`).join('');
    return `<div class="dark coverpanel">
      <div class="heropanel-k">Coverage, counted from the data</div>
      <div class="cov-grid">${cells}</div>
      <div class="heropanel-meta">Every one of the ${c.total} records was checked by hand between <b>${esc(c.from)}</b> and <b>${esc(c.to)}</b>. These figures are counted from the dataset each time this page loads, so they cannot drift away from what is actually published above.</div>
    </div>`;
  }

  /* ================================================================================
     WO2 Task 3 — "Chance Me" estimates. Pro-only; gated through hasTrackerAccess().

     Two facts about the data shape this model (see NOTES.md):
       1. reqs.admittedGpa is NEVER an admitted-student average — it is a stated
          minimum (72), a recommendation (27), or unlabelled (52). So the GPA
          difference measures distance above an eligibility floor, and the model
          leans on it weakly via the damping factor k.
       2. 67 of 150 creditCap values have unit "in residence" — a residency rule,
          not a transfer ceiling. Those never drive the credit gate.
     Constants below were approved before implementation.
     ================================================================================ */
  const EST = {
    // Selectivity bands on the school's own published transfer admit rate, [lo, hi).
    // Fitted to this dataset, not to a generic one: the median rate here is 54.9% and
    // only 10 schools sit under 5%, so the work order's suggested cutoffs would have
    // left four of six bands below the minimum sample. See NOTES.md.
    SEL: [[0, .10], [.10, .25], [.25, .45], [.45, .65], [.65, .85], [.85, 1.0001]],
    MIN_SAMPLE: 5,                // a band with fewer contributors has no benchmark

    BANDS: [                      // [minDelta, maxDelta, multiplier] — discrete, no curve
      [-Infinity, -0.50, 0.40],
      [-0.50,     -0.10, 0.70],
      [-0.10,      0.30, 1.00],
      [ 0.30,      0.70, 1.25],
      [ 0.70,  Infinity, 1.50]
    ],
    // damping: effective = 1 + (multiplier - 1) * k. The weaker the evidence behind
    // the comparison point, the less the GPA difference is allowed to move the rate.
    K: { recommended:1.0, minimum:0.5, unlabelled:0.5, peer:0.4 },
    FLOOR: 0.005,     // 0.5% — below the lowest published rate (0.6%), so never pushes up
    CEIL:  0.95,      // never 100%
    HALF_PUB:  0.25,  // +/- 25% when the comparison point is the school's own figure
    HALF_PEER: 0.45   // +/- 45% when it is a peer benchmark — the tier IS the width
  };
  // credit-cap units that denote an actual transfer ceiling. "in residence" is a
  // residency requirement and is deliberately absent.
  const CAP_UNITS = ['semester','quarter','credits','units','sem. (2-yr)','semester credits','courses'];

  const estNum = v => { const f = parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isFinite(f) ? f : null; };
  const sig2 = x => { if(!(x>0)) return 0; const d = Math.ceil(Math.log10(x)); const f = Math.pow(10, 2-d); return Math.round(x*f)/f; };
  const estPct = x => { const v = x*100; return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%'; };
  const estBare = x => { const v = x*100; return v >= 10 ? v.toFixed(0) : v.toFixed(1); };
  const ratePct = x => { const v = x*100; return (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(0)) + '%'; };

  /* ---- selectivity-band benchmarks, computed at runtime ----
     Most schools publish no GPA figure at all, so a model that requires one produces
     nothing for the majority of the database. Where a school publishes one we use it.
     Where it does not, we compare against the MEDIAN of the figures published by
     schools in the same transfer-selectivity band — and we say so, every time.
     A band with fewer than MIN_SAMPLE contributors has no benchmark and its schools
     get no estimate. Nothing here is hardcoded; it re-derives from TT_DATA on load. */
  const SEL_BENCH = EST.SEL.map(([lo, hi]) => {
    const inBand = S.filter(x => x.rate != null && x.rate >= lo && x.rate < hi);
    const gpas = inBand.map(x => estNum((x.reqs||{}).admittedGpa))
                       .filter(v => v != null).sort((a,b) => a-b);
    const n = gpas.length;
    const median = n ? (n % 2 ? gpas[(n-1)/2] : (gpas[n/2-1] + gpas[n/2]) / 2) : null;
    return { lo, hi, schools: inBand.length, n, median, usable: n >= EST.MIN_SAMPLE };
  });
  // 1-based band index for the selectivity colour scale; 0 when there is no rate
  const selIndex = r => r == null ? 0 : (EST.SEL.findIndex(([lo,hi]) => r >= lo && r < hi) + 1);
  const selBandOf = s => s.rate == null ? null
    : (SEL_BENCH.find(b => s.rate >= b.lo && s.rate < b.hi) || null);
  const bandRange = b => b.lo === 0 ? `under ${ratePct(b.hi)}`
    : b.hi > 1 ? `${ratePct(b.lo)} and over`
    : `${ratePct(b.lo)}\u2013${ratePct(b.hi)}`;

  /* The comparison point, and — the part that must never be blurred — where it came
     from. A benchmark is never presented as though the school published it. */
  function comparisonPoint(s){
    const r = s.reqs || {};
    const own = estNum(r.admittedGpa);
    if(own != null)
      return { kind:'published', gpa:own, basis:(r.admittedGpaBasis||'').trim() || 'unlabelled' };
    const b = selBandOf(s);
    if(b && b.usable) return { kind:'peer', gpa:b.median, band:b };
    return null;
  }

  // how many schools land in each tier — used on the methodology page
  function tierCoverage(){
    let published = 0, peer = 0, none = 0;
    for(const x of S){
      if(x.rate == null){ none++; continue; }
      const cp = comparisonPoint(x);
      if(!cp) none++; else if(cp.kind === 'published') published++; else peer++;
    }
    return { published, peer, none, total:S.length };
  }

  function profile(){ return trk().profile || {gpa:null,credits:null,level:''}; }
  function profileComplete(){ const p = profile(); return p.gpa != null && p.credits != null; }
  function setProfile(patch){
    trkState = Object.assign({}, trk(), { profile: Object.assign({}, profile(), patch) });
    Store.save(trkState);
  }

  // Layer 1 — eligibility gates. Sourced facts, not predictions.
  function eligibility(s, p){
    const gates = [];
    const minCred = estNum(s.minCredits);
    if(minCred != null && p.credits != null && p.credits < minCred)
      gates.push({hard:true, text:`${esc(s.name)} states a minimum of ${minCred} transferable credits. You have entered ${p.credits}.`});
    const minG = estNum(s.minGpa);
    if(minG != null && p.gpa != null && p.gpa < minG)
      gates.push({hard:true, text:`${esc(s.name)} states a minimum GPA of ${minG}. You have entered ${p.gpa.toFixed(2)}.`});
    const r = s.reqs || {};
    const cap = estNum(r.creditCap), unit = (r.creditCapUnit||'').trim();
    if(cap != null && CAP_UNITS.includes(unit) && p.credits != null && p.credits > cap)
      gates.push({hard:true, text:`${esc(s.name)} caps transfer credit at ${cap} ${esc(unit)}. You have entered ${p.credits}.`});
    // residency rules are shown as information, never as a failed gate
    if(cap != null && unit === 'in residence')
      gates.push({hard:false, text:`${esc(s.name)} requires ${cap} credits completed in residence. That is a graduation requirement, not a limit on what you can transfer in.`});
    return gates;
  }

  // Layer 3 — the estimate. Returns a {suppressed} marker when it must not be shown.
  function estimate(s, p){
    if(s.rate == null) return {suppressed:'no-rate'};
    if(p.gpa == null) return {suppressed:'no-profile'};
    const cp = comparisonPoint(s);
    if(!cp) return {suppressed:'no-benchmark', band:selBandOf(s),
                    stated:((s.reqs||{}).admittedGpa||'').trim()};
    const delta = p.gpa - cp.gpa;
    const m = EST.BANDS.find(([lo,hi]) => delta >= lo && delta < hi)[2];
    const k = cp.kind === 'peer' ? EST.K.peer
            : (EST.K[cp.basis] != null ? EST.K[cp.basis] : EST.K.unlabelled);
    const mEff = 1 + (m - 1) * k;
    const point = Math.min(EST.CEIL, Math.max(EST.FLOOR, s.rate * mEff));
    // the confidence tier IS the range width — a peer benchmark reads visibly wider
    const half = cp.kind === 'peer' ? EST.HALF_PEER : EST.HALF_PUB;
    const lo = sig2(Math.max(EST.FLOOR, point * (1 - half)));
    const hi = sig2(Math.min(EST.CEIL, point * (1 + half)));
    return { cp, base:s.rate, ag:cp.gpa, basis:cp.basis, delta, m, k, mEff, point, half,
             lo, hi, range: `${estBare(lo)}\u2013${estPct(hi)}` };
  }

  function wireProfile(){
    const flag = $('#pf-saved');
    const ping = () => { if(flag){ flag.textContent='Saved'; setTimeout(()=>{flag.textContent='';},1600); } };
    const gpa = $('#pf-gpa'), cred = $('#pf-cred'), lvl = $('#pf-lvl');
    // one timer PER FIELD — a shared timer would let a later field cancel an
    // earlier field's pending write and silently drop the user's input
    const timers = {};
    const debounce = (key, fn) => { clearTimeout(timers[key]); timers[key] = setTimeout(fn, 400); };
    if(gpa) gpa.addEventListener('input', () => debounce('gpa', () => {
      const v = parseFloat(gpa.value);
      setProfile({gpa: isFinite(v) ? Math.min(4, Math.max(0, v)) : null}); ping(); drawTracker(); }));
    if(cred) cred.addEventListener('input', () => debounce('cred', () => {
      const v = parseInt(cred.value,10);
      setProfile({credits: isFinite(v) ? Math.max(0, v) : null}); ping(); drawTracker(); }));
    if(lvl) lvl.addEventListener('change', () => { setProfile({level: lvl.value}); ping(); });
  }

  /* ---- the three layers rendered per saved school ---- */
  function chanceBlock(s){
    if(!hasTrackerAccess()) return '';
    const p = profile();
    if(!profileComplete())
      return `<div class="est-wrap est-empty">Add your GPA and credits above to see how you compare with what ${esc(s.name)} publishes.</div>`;
    const gates = eligibility(s, p);
    const hard = gates.filter(g => g.hard);
    const r = s.reqs || {};
    const src = `<a class="est-src" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">source \u2197</a>`;

    // layer 1
    const gateHtml = gates.length ? `<ul class="est-gates">${gates.map(g =>
      `<li class="${g.hard?'g-hard':'g-info'}"><span aria-hidden="true">${g.hard?'\u2715':'\u2139'}</span><span>${g.text} ${src}</span></li>`).join('')}</ul>` : '';

    // layer 2 — the comparison point, and where it came from. A peer benchmark is
    // never dressed up as the school's own figure.
    const cp = comparisonPoint(s);
    const cap = estNum(r.creditCap), unit = (r.creditCapUnit||'').trim();
    const cmp = [];
    if(cp && cp.kind === 'published')
      cmp.push([`Your GPA vs this school\u2019s published figure`, `${p.gpa.toFixed(2)} vs ${cp.gpa}`,
        `${esc(cp.basis)} \u2014 ${esc(s.name)}\u2019s own number, not an admitted average`]);
    else if(cp && cp.kind === 'peer')
      cmp.push([`Your GPA vs a peer benchmark`, `${p.gpa.toFixed(2)} vs ${cp.gpa}`,
        `median of ${cp.band.n} schools with a ${bandRange(cp.band)} transfer admit rate \u2014 <b>not</b> ${esc(s.name)}\u2019s figure`]);
    else if((r.admittedGpa||'').trim())
      cmp.push([`Published GPA figure`, esc(r.admittedGpa), 'not a number we can compare against']);
    if(cap != null && CAP_UNITS.includes(unit))
      cmp.push([`Your credits vs transfer cap`, `${p.credits} vs ${cap}`, esc(unit)]);

      `<div><b>${k}</b><span class="num">${v}</span><i>${sub}</i></div>`).join('')}</div>` : '';

      return `<div class="est-wrap">${gateHtml}${cmpHtml}

        : e.suppressed === 'no-rate'
        ? `${esc(s.name)} publishes no transfer admit rate, so there is no base rate to work from.`

    const staleMark = cycleState(s) === 'behind2'
      ? `<span class="est-stale">${cycleTag(s)} this school\u2019s figures are two or more cycles behind</span>` : '';
    // the tier is stated structurally, on the estimate itself — not in a footnote
    const tier = peer
      ? `<div class="est-tier est-tier-peer"><b>Compared against similar schools</b>
           ${esc(s.name)} publishes no GPA figure of its own. The comparison point is the median published figure across the <b>${cp.band.n} schools</b> whose transfer admit rate is <b>${bandRange(cp.band)}</b>. The range below is deliberately wider because of it.</div>`

      : `<tr><td>Comparison point \u2014 this school\u2019s published GPA figure (${esc(e.basis)})</td><td class="num">${e.ag}</td><td><span class="est-tag-src">sourced</span> ${src}</td></tr>`;
    const kRow = peer
      ? `<tr><td>Damping, because the comparison point is a peer benchmark rather than this school\u2019s figure</td><td class="num">\u00d7${e.k.toFixed(2)}</td><td><span class="est-tag-own">our weighting</span></td></tr>`
      : `<tr><td>Damping, because that figure is a ${esc(e.basis)}</td><td class="num">\u00d7${e.k.toFixed(2)}</td><td><span class="est-tag-own">our weighting</span></td></tr>`;

    return `<div class="est-wrap">${gateHtml}${cmpHtml}
      <div class="estimate${peer?' estimate-peer':''}">
        <div class="est-label"><span class="est-dot" aria-hidden="true"></span>TransferVerified Estimate
          <span class="est-tierchip">${peer?'peer benchmark':'school-published'}</span></div>
        <div class="est-range">roughly ${e.range}</div>
        ${tier}
        ${staleMark}
        <details class="est-break">
          <summary>How we got this</summary>
          <div class="est-body">
            <p class="est-model">${peer ? MODEL_SENTENCE_PEER : MODEL_SENTENCE_PUB}</p>
            <table class="est-table">
              <tr><td>${esc(s.name)}\u2019s published transfer admit rate</td><td class="num">${estPct(e.base)}</td><td><span class="est-tag-src">sourced</span> ${src}</td></tr>
              ${cpRow}
              <tr><td>Your GPA</td><td class="num">${p.gpa.toFixed(2)}</td><td><span class="est-tag-you">yours</span></td></tr>
              <tr><td>Difference</td><td class="num">${e.delta>=0?'+':''}${e.delta.toFixed(2)}</td><td><span class="est-tag-calc">calculated</span></td></tr>
              <tr><td>Band multiplier for that difference</td><td class="num">\u00d7${e.m.toFixed(2)}</td><td><span class="est-tag-own">our weighting</span></td></tr>
              ${kRow}
              <tr><td>Applied to the base rate</td><td class="num">${estPct(e.base)} \u00d7 ${e.mEff.toFixed(2)}</td><td><span class="est-tag-calc">calculated</span></td></tr>
              <tr><td>Shown as a range of \u00b1${Math.round(e.half*100)}%, not a point${peer?' \u2014 wider, because the comparison point is not this school\u2019s':''}</td><td class="num">${e.range}</td><td><span class="est-tag-own">ours</span></td></tr>
            </table>
            <p class="est-disc">${MODEL_DISCLAIMER}</p>
          </div>
        </details>

  }

  /* ================= the model, documented in public =================
     Every figure below is computed from TT_DATA at load, so the page cannot drift
     away from what the model actually does when the dataset moves. */
  function estimateMethodology(){
    const cov = tierCoverage();
    const minG = S.filter(x => x.reqs && (x.reqs.admittedGpaBasis||'') === 'minimum').length;
    const recG = S.filter(x => x.reqs && (x.reqs.admittedGpaBasis||'') === 'recommended').length;

    const benchRows = SEL_BENCH.map(b => `<tr class="${b.usable?'':'bench-out'}">
        <td>${esc(bandRange(b))}</td>
        <td class="num">${b.schools}</td>
        <td class="num">${b.n}</td>
        <td class="num">${b.usable ? b.median.toFixed(2) : '\u2014'}</td>
        <td>${b.usable ? '<span class="bench-ok">in use</span>'
                       : `<span class="bench-no">no benchmark \u2014 needs ${EST.MIN_SAMPLE}</span>`}</td>
      </tr>`).join('');

    return `
      <h3 class="method-sub">How the TransferVerified Estimate works</h3>
      <p class="method-lead">Saved schools in the Tracker can show an estimate. It is <b>ours, not the school\u2019s</b>, and it is documented here in full because a formula we would not show you is not one worth shipping.</p>

      <h4 class="method-h4">The problem this model has to solve</h4>
      <p class="method-lead">Only <b>${cov.published} of the ${cov.total}</b> schools in this database publish a GPA figure for transfer applicants at all. A model that requires one produces nothing for the majority of the site. So where a school publishes a figure we use it; where it does not, we compare against a benchmark built from schools of similar transfer selectivity \u2014 and we always say which of the two is in play.</p>

      <div class="dark benchpanel">
        <div class="heropanel-k">Selectivity bands, computed from the data at load</div>
        <div class="hp-title">Benchmark GPA by transfer admit rate</div>
        <table class="benchtable">
          <thead><tr><th>Transfer admit rate</th><th>Schools</th><th>Publish a GPA</th><th>Median</th><th>Status</th></tr></thead>
          <tbody>${benchRows}</tbody>
        </table>
        <div class="heropanel-meta">A band\u2019s benchmark is the <b>median</b> of the GPA figures published by the schools inside it, and it is only usable when at least <b>${EST.MIN_SAMPLE}</b> schools contribute one. Below that the band has no benchmark and its schools get no estimate \u2014 we would rather show nothing than a number resting on two schools.</div>
      </div>

      <h4 class="method-h4">The two confidence tiers</h4>
      <p class="method-lead">The tier is not a footnote. It changes how wide the number is.
      <br><br><b>School-published comparison</b> \u2014 the school publishes its own GPA figure. Range of <b>\u00b1${Math.round(EST.HALF_PUB*100)}%</b> around the point estimate. <b>${cov.published} schools.</b>
      <br><br><b>Peer-derived benchmark</b> \u2014 the school publishes none, so the comparison point is the median across its selectivity band. Range of <b>\u00b1${Math.round(EST.HALF_PEER*100)}%</b> \u2014 visibly wider, because the comparison point is not this school\u2019s own number \u2014 and labelled as such on every estimate. <b>${cov.peer} schools.</b>
      <br><br><b>No estimate at all</b> \u2014 <b>${cov.none} school${cov.none===1?'':'s'}</b>, because ${cov.none===1?'it publishes':'they publish'} no transfer admit rate, so there is no base rate to start from.</p>

      <h4 class="method-h4">The calculation</h4>
      <p class="method-lead">We start from the transfer admit rate the school publishes. We compare your GPA with the comparison point and apply one of five fixed multipliers, depending on which band the difference falls into:
      <span class="est-bands">${EST.BANDS.map(([lo,hi,m]) => `<span><b>${lo===-Infinity?'below \u22120.50':hi===Infinity?'+0.70 and above':(lo>0?'+':'')+lo.toFixed(2)+' to '+(hi>0?'+':'')+hi.toFixed(2)}</b>\u00d7${m.toFixed(2)}</span>`).join('')}</span>
      There is no curve. Five bands is as fine as this data honestly supports.
      <br><br><b>We then weaken that adjustment</b> according to how much the comparison point is actually worth \u2014 to <b>${EST.K.recommended.toFixed(2)}\u00d7</b> its full effect for a school\u2019s own recommended figure, <b>${EST.K.minimum.toFixed(2)}\u00d7</b> for a school\u2019s own stated minimum, and <b>${EST.K.peer.toFixed(2)}\u00d7</b> for a peer benchmark. Clearing a minimum tells you much less than beating a recommendation, and a benchmark from other schools tells you less still. Across the whole dataset not one school publishes the actual average GPA of admitted transfers; ${minG} publish a minimum and ${recG} publish a recommendation.
      <br><br>The result is clamped between <b>${estPct(EST.FLOOR)}</b> and <b>${estPct(EST.CEIL)}</b> \u2014 never 0%, never 100% \u2014 and shown as a range rounded to two significant figures, never as a single number. The estimate rises with your GPA and never falls.</p>

      <h4 class="method-h4">What the model does and does not use</h4>
      <p class="method-lead"><b>It uses:</b> the school\u2019s own published transfer admit rate, its own published GPA figure where one exists, the median published GPA of its selectivity band where one does not, and the GPA and credit count you enter.
      <br><br><b>It does not use:</b> test scores (the dataset contains none for transfers), essays, recommendations, your major, your residency, your intended term, or anything else about you. It cannot see how you compare with the people you are actually competing against, and it cannot see a school\u2019s internal priorities. Treat it as a rough orientation, not a decision.</p>

    `;
  }

  const searchSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#03396C" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

  function wireAutocomplete(){

      if(!items.length){ menu.innerHTML = `<div class="ac-empty">No school matches “${esc(input.value.trim())}”.</div>`; }
      else { menu.innerHTML = items.map((s,i) =>
        `<div class="ac-item ${i===acActive?'active':''}" data-slug="${esc(s.slug)}"><b>${esc(s.name)}</b><span class="st">${esc(s.state)} · ${s.control}</span></div>`).join(''); }

  /* ---------- the single storage module ----------
     Nothing else in this codebase calls localStorage. Work Order 02 swaps the
     internals of these three functions for authenticated server-side storage and
     everything above this line keeps working unchanged.
     TODO(WO-02): swap for server-backed storage */
  const Store = (function(){
    const KEY = 'transferverified.tracker.v1';
    const VERSION = 2;   // v2 adds `profile`; v1 payloads migrate forward on load
    const emptyProfile = () => ({ gpa:null, credits:null, level:'' });
    const empty = () => ({ schemaVersion:VERSION, updatedAt:null, saved:[], profile:emptyProfile() });

    function load(){
      let raw = null;
      try{ raw = window.localStorage.getItem(KEY); }
      catch(e){ return empty(); }            // private mode / storage disabled
      if(!raw) return empty();
      let parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ return empty(); }            // corrupt payload: start clean, don't destroy it
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.saved)) return empty();
      if(typeof parsed.schemaVersion !== 'number' || parsed.schemaVersion > VERSION) return empty();
      // normalise: drop malformed entries, keep ranks dense and ordered
      const saved = parsed.saved
        .filter(e => e && typeof e.slug === 'string')
        .map(e => ({ slug:e.slug, rank:Number(e.rank)||0, note:typeof e.note==='string'?e.note:'',
                     addedAt:e.addedAt || null }))
        .sort((a,b) => a.rank - b.rank)
        .map((e,i) => Object.assign({}, e, {rank:i}));
      // migrate 1 -> 2: a v1 payload simply has no profile yet
      const p = (parsed.profile && typeof parsed.profile === 'object') ? parsed.profile : {};
      const profile = {
        gpa: (typeof p.gpa === 'number' && isFinite(p.gpa)) ? p.gpa : null,
        credits: (typeof p.credits === 'number' && isFinite(p.credits)) ? p.credits : null,
        level: ['freshman','sophomore','junior'].includes(p.level) ? p.level : ''
      };
      return Object.assign({}, parsed, { schemaVersion:VERSION, saved, profile });
    }
    function save(state){
      const prev = load();
      // merge so a newer client's unknown keys survive a round-trip through this one
      const next = Object.assign({}, prev, state, {
        schemaVersion: VERSION,
        updatedAt: new Date().toISOString()
      });
      try{ window.localStorage.setItem(KEY, JSON.stringify(next)); }
      catch(e){ return false; }              // quota or disabled — caller surfaces it
      return true;
    }
    function clear(){
      try{ window.localStorage.removeItem(KEY); }catch(e){}
    }
    return { load, save, clear, KEY, VERSION };
  })();

  const trk = () => (trkState || (trkState = Store.load()));
  function trkCommit(saved){
    saved.forEach((e,i) => { e.rank = i; });
    trkState = Object.assign({}, trk(), {saved});
    Store.save(trkState);
  }
  const isSaved = slug => trk().saved.some(e => e.slug === slug);
  function trkAdd(slug){
    if(isSaved(slug) || !BY_SLUG[slug]) return;
    const saved = trk().saved.slice();
    saved.push({slug, rank:saved.length, note:'', addedAt:new Date().toISOString()});
    trkCommit(saved);
  }
  function trkRemove(slug){ trkCommit(trk().saved.filter(e => e.slug !== slug)); }
  function trkMove(slug, delta){
    const saved = trk().saved.slice();
    const i = saved.findIndex(e => e.slug === slug);
    const j = i + delta;
    if(i < 0 || j < 0 || j >= saved.length) return;
    saved.splice(j, 0, saved.splice(i,1)[0]);
    trkCommit(saved);
  }

  /* ---------- deadline resolution ----------
     fallDeadlineIso is stored MM-DD with no year, so it is resolved to the next
     occurrence relative to today purely so the list can sort. No synthesised year is
     ever displayed. Anything that will not parse goes to an explicit group with a
     link to the school's own page — never dropped, never guessed. */
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTH_NUM = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,
    january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};

  // Returns {mo, da, yr|null} for a single unambiguous date, else null.
  // Anything with a range, a qualifier, or more than one date stays null on purpose —
  // those belong in "date needs confirming", not in a date we invented.
  function parseDate(txt){
    const t = txt.trim().replace(/\s+/g,' ');
    let m;
    // "October 1, 2025" / "Oct 1 2025" / "September 15"
    m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?$/.exec(t);
    if(m && MONTH_NUM[m[1].toLowerCase()]) return {mo:MONTH_NUM[m[1].toLowerCase()], da:+m[2], yr:m[3]?+m[3]:null};
    // "1 October 2025"
    m = /^(\d{1,2})\s+([A-Za-z]{3,9})\.?(?:,?\s*(\d{4}))?$/.exec(t);
    if(m && MONTH_NUM[m[2].toLowerCase()]) return {mo:MONTH_NUM[m[2].toLowerCase()], da:+m[1], yr:m[3]?+m[3]:null};
    // "12/1" / "10/15/2025"
    m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(t);
    if(m){
      const mo=+m[1], da=+m[2];
      if(mo>=1 && mo<=12 && da>=1 && da<=31){
        let yr = m[3] ? +m[3] : null;
        if(yr!=null && yr<100) yr += 2000;
        return {mo, da, yr};
      }
    }
    return null;
  }

  function resolveDeadline(s, which){
    const r = s.reqs || {};
    const raw = which==='fall' ? (r.fallDeadline || s.fallDeadline) : (r.springDeadline || s.springDeadline);
    const txt = (raw || '').trim();
    if(!txt || txt.toLowerCase()==='none') return {kind:'none'};

    let parsed = null;
    // the ISO field is the most reliable source where it exists (MM-DD, no year)
    if(which==='fall' && /^\d{2}-\d{2}$/.test(r.fallDeadlineIso || '')){
      const [mo,da] = r.fallDeadlineIso.split('-').map(Number);
      parsed = {mo, da, yr:null};
    }
    if(!parsed) parsed = parseDate(txt);
    if(!parsed) return {kind:'unparsed', text:txt};

    // Only a year the source actually stated is ever displayed. Where none was
    // stated we resolve to the next occurrence purely so the list can sort, and
    // we show the date without a year.
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let y = parsed.yr;
    if(y == null){
      y = now.getFullYear();
      if(new Date(y, parsed.mo-1, parsed.da) < today) y += 1;
    }
    const when = new Date(y, parsed.mo-1, parsed.da);
    return {
      kind:'date', text:txt, when, hasYear: parsed.yr != null,
      label: MONTHS[parsed.mo-1] + ' ' + parsed.da + (parsed.yr != null ? ', ' + parsed.yr : ''),
      sortKey: `${y}-${String(parsed.mo).padStart(2,'0')}-${String(parsed.da).padStart(2,'0')}`
    };
  }
  function daysAway(d){
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((d - t) / 86400000);
  }

    return `<div class="empty">
      <h3>Nothing saved yet.</h3>
      <p>Open any school and choose “Save to tracker”, or add one from the list below. Your list is ranked in the order you add them — you can reorder it any time.</p>
      <a class="btn btn-primary" href="#/all">Find schools to add</a>
    </div>`;
  }

  function trackerList(rows){
    if(!rows.length) return `<div class="tablecard">${trackerEmpty()}</div>` + trackerAdder();
    const items = rows.map(({entry, school}, i) => {
      if(!school){
        return `<li class="trkrow trkrow-missing" data-slug="${esc(entry.slug)}">
          <div class="trkrank">${i+1}</div>
          <div class="trkmain">
            <div class="trkname">${esc(entry.slug)}</div>
            <div class="meta">This school is no longer in our dataset, so we can't show its figures. Your note is kept.</div>
            ${entry.note?`<div class="trknote-ro">${esc(entry.note)}</div>`:''}
          </div>
          <div class="trkacts"><button class="iconbtn" data-action="remove" data-slug="${esc(entry.slug)}" aria-label="Remove ${esc(entry.slug)} from your list">Remove</button></div>
        </li>`;
      }
      const d = resolveDeadline(school,'fall');
      return `<li class="trkrow" draggable="true" data-slug="${esc(school.slug)}">
        <div class="trkrank" aria-hidden="true">${i+1}</div>
        <div class="trkmain">
          <div class="trkhead">
            <a class="trkname" href="#/school/${esc(school.slug)}">${esc(school.name)}</a>
            <span class="tag ${school.control}">${school.control}</span>
          </div>
          <div class="trkstats">
            <span class="trkrate num">${isGap(school)?'not published':pctSet(school.rate)}</span>
            ${cycleTag(school)}
            <span class="meta">${esc(school.state)}</span>
            <span class="meta">Fall: ${d.kind==='date'?esc(d.text):(d.kind==='unparsed'?esc(d.text):'not published')}</span>
          </div>
          <label class="trknote-l" for="note-${esc(school.slug)}">Your note</label>
          <textarea class="trknote" id="note-${esc(school.slug)}" data-slug="${esc(school.slug)}"
            rows="2" placeholder="Anything you want to remember about ${esc(school.name)}…">${esc(entry.note)}</textarea>
          <span class="trksaved" data-for="${esc(school.slug)}" aria-live="polite"></span>
          ${chanceBlock(school)}
        </div>
        <div class="trkacts">
          <button class="iconbtn" data-action="up" data-slug="${esc(school.slug)}" ${i===0?'disabled':''} aria-label="Move ${esc(school.name)} up to rank ${i}">↑</button>
          <button class="iconbtn" data-action="down" data-slug="${esc(school.slug)}" ${i===rows.length-1?'disabled':''} aria-label="Move ${esc(school.name)} down to rank ${i+2}">↓</button>
          <button class="iconbtn" data-action="remove" data-slug="${esc(school.slug)}" aria-label="Remove ${esc(school.name)} from your list">Remove</button>
        </div>
      </li>`;
    }).join('');
    return `<p class="trkhint">Ranked by where you most want to go. Drag a row, or use the ↑ ↓ buttons — both do the same thing.</p>
      <ol class="trklist" id="trklist">${items}</ol>` + trackerAdder();
  }

  function trackerAdder(){
    const options = S.filter(s => !isSaved(s.slug))
      .slice().sort((a,b)=>a.name.localeCompare(b.name))
      .map(s => `<option value="${esc(s.slug)}">${esc(s.name)} — ${esc(s.state)}</option>`).join('');
    if(!options) return `<p class="trkhint" style="margin-top:var(--s5)">All ${S.length} schools are on your list.</p>`;
    return `<div class="trkadd">
      <label for="trkpick">Add a school</label>
      <select id="trkpick"><option value="">Choose a school…</option>${options}</select>
      <button class="btn" type="button" id="trkaddbtn">Add to list</button>
    </div>`;
  }

  function trackerDeadlines(rows){
    if(!rows.length) return `<div class="tablecard">${trackerEmpty()}</div>`;
    const dated = [], unclear = [];
    rows.forEach(({school}) => {
      if(!school) return;
      ['fall','spring'].forEach(which => {
        const d = resolveDeadline(school, which);
        if(d.kind === 'date') dated.push({school, which, d});
        else if(d.kind === 'unparsed') unclear.push({school, which, d});
      });
    });
    dated.sort((a,b) => a.d.sortKey.localeCompare(b.d.sortKey) || a.school.name.localeCompare(b.school.name));

    const datedHtml = dated.map(({school, which, d}) => {
      const away = daysAway(d.when);
      return `<li class="dlrow">
        <div class="dlwhen"><b>${esc(d.label)}</b><span>${away<0?'date has passed':(away===0?'today':away+' day'+(away===1?'':'s')+' away')}</span></div>
        <div class="dlmain">
          <a class="trkname" href="#/school/${esc(school.slug)}">${esc(school.name)}</a>
          <div class="meta">${which==='fall'?'Fall':'Spring'} transfer · as published: ${esc(d.text)}</div>
        </div>
        <a class="golink" href="${esc((school.reqs&&school.reqs.transferUrl)||school.sourceUrl)}" target="_blank" rel="noopener">check ↗</a>
      </li>`;
    }).join('');

    const unclearHtml = unclear.map(({school, which, d}) => `<li class="dlrow dlrow-unclear">
      <div class="dlwhen"><b>—</b><span>needs confirming</span></div>
      <div class="dlmain">
        <a class="trkname" href="#/school/${esc(school.slug)}">${esc(school.name)}</a>
        <div class="meta">${which==='fall'?'Fall':'Spring'} transfer · the school publishes “${esc(d.text)}”, which isn't a single date we can place on a calendar.</div>
      </div>
      <a class="golink" href="${esc((school.reqs&&school.reqs.transferUrl)||school.sourceUrl)}" target="_blank" rel="noopener">confirm ↗</a>
    </li>`).join('');

    return `
      ${dated.length?`<ol class="dllist">${datedHtml}</ol>`
        :`<div class="tablecard"><div class="empty"><h3>No dated deadlines yet.</h3>
           <p>None of your saved schools publishes a deadline we can place on a calendar. Anything we couldn't read is listed below with a link to the school's own page.</p></div></div>`}
      ${unclear.length?`<div class="dlunclear">
        <h3>Date needs confirming <span class="dlcount">${unclear.length}</span></h3>
        <p>These schools publish something other than one fixed date — a rolling window, a priority date, or a per-programme rule. We won't guess a date for you. Check each one on the school's own page.</p>
        <ol class="dllist">${unclearHtml}</ol>
      </div>`:''}`;
  }

  function wireTrackerList(){
    const list = $('#trklist');
    if(list){
      list.addEventListener('click', e => {
        const b = e.target.closest('.iconbtn'); if(!b || b.disabled) return;
        const slug = b.dataset.slug;
        if(b.dataset.action==='up') trkMove(slug,-1);
        else if(b.dataset.action==='down') trkMove(slug,1);
        else if(b.dataset.action==='remove') trkRemove(slug);
        drawTracker();
        const next = $('#trklist') && $('#trklist').querySelector(`.iconbtn[data-slug="${slug}"][data-action="${b.dataset.action}"]`);
        if(next && !next.disabled) next.focus();
      });
      // notes autosave
      list.querySelectorAll('.trknote').forEach(t => {
        let timer = null;
        t.addEventListener('input', () => {
          const slug = t.dataset.slug;
          clearTimeout(timer);
          timer = setTimeout(() => {
            trkNote(slug, t.value);
            const flag = list.querySelector(`.trksaved[data-for="${slug}"]`);
            if(flag){ flag.textContent = 'Saved'; setTimeout(()=>{ flag.textContent=''; }, 1600); }
          }, 400);
        });
      });
      // drag to reorder — the keyboard path above is equivalent, not a lesser fallback
      list.querySelectorAll('.trkrow[draggable]').forEach(row => {
        row.addEventListener('dragstart', e => { trkDrag = row.dataset.slug; row.classList.add('dragging');
          if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', trkDrag); }catch(_){} } });
        row.addEventListener('dragend', () => { trkDrag=null; row.classList.remove('dragging'); });
        row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('dragover'); });
        row.addEventListener('dragleave', () => row.classList.remove('dragover'));
        row.addEventListener('drop', e => {
          e.preventDefault(); row.classList.remove('dragover');
          const from = trkDrag, to = row.dataset.slug;
          if(!from || from===to) return;
          const saved = trk().saved.slice();
          const i = saved.findIndex(x=>x.slug===from), j = saved.findIndex(x=>x.slug===to);
          if(i<0||j<0) return;
          saved.splice(j, 0, saved.splice(i,1)[0]);
          trkCommit(saved); drawTracker();
        });
      });
    }
    const pick = $('#trkpick'), add = $('#trkaddbtn');
    if(add) add.addEventListener('click', () => {
      const v = pick && pick.value; if(!v) return;
      trkAdd(v); drawTracker();
    });
  }
  function wireTrackerDeadlines(){ /* deadline rows are plain links; nothing to wire */ }

  /* save/remove control shown on a school page — the tracker's only reach into the
     free site, and it never gates or interrupts anything that was already there */
  function trackerToggleBtn(s){
    if(!hasTrackerAccess()) return '';
    const on = isSaved(s.slug);
    return `<button class="btn trktoggle ${on?'on':''}" type="button" id="trksave" data-slug="${esc(s.slug)}" aria-pressed="${on}">
      ${on?'✓ Saved to tracker':'+ Save to tracker'}</button>`;
  }
  function wireTrackerToggle(){
    const b = $('#trksave'); if(!b) return;
    b.addEventListener('click', () => {
      const slug = b.dataset.slug;
      if(isSaved(slug)) trkRemove(slug); else trkAdd(slug);
      const on = isSaved(slug);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? '✓ Saved to tracker' : '+ Save to tracker';
    });
  }

  /* ============ ROUTER ============ */
  function go(hash){ if(location.hash===hash) route(); else location.hash=hash; }
  function setActiveTab(tab){ document.querySelectorAll('nav .tab').forEach(a => a.classList.toggle('on', a.dataset.tab===tab)); }
  function route(){
    const h = location.hash || '#/';
    const m = h.match(/^#\/school\/(.+)$/);
    if(m){ setActiveTab('apply'); renderSchool(decodeURIComponent(m[1])); }
    else if(h.startsWith('#/tracker')){ setActiveTab('tracker'); renderTracker(); }
    else if(h.startsWith('#/apply')){ setActiveTab('apply'); renderApply(); }
    else if(h.startsWith('#/all')||h.startsWith('#/rates')){ setActiveTab('rates'); renderRates(); }
    else if(h.startsWith('#/top')){ setActiveTab('top'); renderTop(); }
    else if(h.startsWith('#method')){ /* in-page anchor on current view */ return; }
    // WO3 Task 3: the root is Home. Top 75 moved to #/top; a bookmark to the old root
    // now lands on Home, which is intended.
    else { setActiveTab('home'); renderHome(); }
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
